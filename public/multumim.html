<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mulțumim · Centrul Creștin Sion Blaj</title>
  <meta name="theme-color" content="#DD000D">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/assets/favicon.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app.css">
  <script type="module" src="/thanks.js"></script>
</head>
<body>
  <header class="topbar">
    <a href="/" class="brand" aria-label="Centrul Creștin Sion Blaj">
      <img src="/assets/logo-lockup.svg" alt="Centrul Creștin Sion Blaj" width="110" height="44">
    </a>
  </header>

  <main>
    <section class="thanks" id="thanks" aria-live="polite">
      <div class="badge" id="badge">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="m5 12.5 4.5 4.5L19 7.5"/></svg>
      </div>
      <h1 id="title">Mulțumim!</h1>
      <p class="amount" id="amount"></p>
      <p id="message">Se verifică plata…</p>
    </section>

    <div class="after">
      <figure class="verse">
        <blockquote>„Fiecare să dea după cum a hotărât în inima lui: nu cu părere de rău sau de silă, căci pe cel ce dă cu bucurie îl iubește Dumnezeu.”</blockquote>
        <figcaption>2 Corinteni 9:7</figcaption>
      </figure>
      <a class="cta" href="/" id="again">Fă o altă donație</a>
    </div>
  </main>

  <footer class="footer">
    <img src="/assets/logo-mark.svg" alt="" width="28" height="24">
    <span>Centrul Creștin Sion Blaj</span>
  </footer>
</body>
</html>
